<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم | NEONBYTE</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-body"><main class="admin-shell"><header class="admin-header"><div><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NEON<span class="accent">BYTE</span><small>CONTROL CENTER</small></span></a><h1>لوحة <span class="accent">التحكم</span></h1><p class="notice">إدارة كتالوج المنتجات في متجرك.</p></div><div class="admin-actions"><a class="secondary-btn" href="index.html">عرض المتجر ↗</a><button id="logout" class="secondary-btn">تسجيل الخروج</button></div></header>
<div class="admin-cards"><div class="metric"><small>إجمالي المنتجات</small><strong id="metricProducts">—</strong></div><div class="metric"><small>المنتجات النشطة</small><strong id="metricActive">—</strong></div><div class="metric"><small>حالة قاعدة البيانات</small><strong id="metricStatus" style="font-size:15px">جارٍ التحقق</strong></div></div>
<div class="admin-layout"><section class="admin-panel"><h2 id="formTitle">إضافة منتج جديد</h2><form id="productForm"><input id="productId" type="hidden"><div class="field"><label for="name">اسم المنتج</label><input id="name" required maxlength="100" placeholder="مثال: سماعة Phantom X"></div><div class="field"><label for="category">القسم</label><select id="category"><option>سماعات</option><option>كيبورد</option><option>ماوس</option><option>إكسسوارات</option></select></div><div class="field"><label for="price">السعر بالجنيه المصري</label><input id="price" type="number" min="0" step="1" required></div><div class="field"><label for="emoji">رمز المنتج (إيموجي)</label><input id="emoji" maxlength="8" value="🎮"></div><div class="field"><label for="description">الوصف</label><textarea id="description" rows="3" maxlength="300" placeholder="وصف مختصر للمنتج"></textarea></div><div class="field"><label><input id="active" type="checkbox" checked style="width:auto"> المنتج ظاهر في المتجر</label></div><div class="admin-actions"><button class="btn btn-primary" type="submit">حفظ المنتج</button><button class="secondary-btn" type="button" id="resetForm">تفريغ الحقول</button></div><div id="adminMessage" class="auth-message"></div></form></section>
<section class="admin-panel"><h2>المنتجات الحالية</h2><div id="adminProducts" class="admin-products"><p class="empty-admin">جاري التحميل...</p></div></section></div>
<p class="notice" style="margin-top:20px">مهم: لوحة التحكم تحتاج إعداد Supabase وصلاحيات RLS. لا تضع مفتاح service_role في ملفات الموقع.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
